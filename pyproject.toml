[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "oxbrook"
# Taken from Cargo.toml by maturin, so the version is written in one place.
dynamic = ["version"]
description = "Fast Python REST framework with a Rust core, built-in streams, and agent-native interfaces"
readme = "README.md"
# 3.14 only, in both builds: the only interpreters the suites run on.
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ishanga Vidusha" }]
keywords = ["web", "framework", "rest", "api", "rust", "free-threading", "sse", "websocket", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Rust",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.9"]

[project.urls]
Homepage = "https://github.com/ishangavidusha/oxbrook"
Documentation = "https://ishangavidusha.github.io/oxbrook/"
Source = "https://github.com/ishangavidusha/oxbrook"
Changelog = "https://github.com/ishangavidusha/oxbrook/blob/main/CHANGELOG.md"
Issues = "https://github.com/ishangavidusha/oxbrook/issues"


[project.scripts]
# Two names for one command: `oxbrook` in documentation, `oxb` to type. `ox`
# was taken, by a terminal text editor Homebrew installs.
oxbrook = "oxbrook._cli:entry"
oxb = "oxbrook._cli:entry"

[project.optional-dependencies]
redis = ["redis>=5"]
bench = ["uvicorn", "granian", "fastapi"]
test = ["httpx[http2]", "cryptography", "openapi-spec-validator", "websockets", "redis>=5", "mcp", "coverage"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26", "ruff"]

[tool.maturin]
python-source = "python"
module-name = "oxbrook._core"
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["target", "target-cov"]

[tool.ruff.lint]
# Deliberately narrower than "everything": these are the families that catch
# real mistakes rather than restyle working code. `ruff format` is not run —
# the Python here is hand-formatted consistently, and reformatting 3400 lines
# would be 1162 changed lines of churn for no defect caught.
select = ["E", "F", "I", "UP", "B", "BLE", "RUF"]
ignore = [
    # `Depends(...)` in a default argument is the dependency-injection API,
    # not a mistake. Every handler that takes a dependency trips this.
    "B008",
    # `[first] + rest` is clearer than unpacking for the two places it appears.
    "RUF005",
]

[tool.ruff.lint.per-file-ignores]
# Suites and benchmarks catch broadly on purpose: a probe that lets an
# unexpected exception escape reports nothing, and the point is the report.
"tests/*" = ["BLE001"]
"bench/*" = ["BLE001", "UP031", "E501"]
"examples/*" = ["BLE001"]

[tool.coverage.run]
# The CLI suite drives real `oxbrook` processes, and the reload supervisor
# starts servers of its own. Without following them, every line of the CLI
# would count as unexecuted. `make coverage` passes absolute paths for the data
# file and the source, because those processes run from another directory.
patch = ["subprocess"]

[tool.cibuildwheel]
# Both 3.14 builds, nothing else: the only interpreters the suites run on.
build = ["cp314-*", "cp314t-*"]
# musl would need its own CI leg to mean anything; pip builds from the sdist.
skip = ["*-musllinux_*"]
build-verbosity = 1
# Each wheel is installed into a clean environment and a handful of suites run
# against it from a copy of tests/, away from the source tree, so the import
# can only resolve to the wheel. Which suites, and the order, is in the runner;
# it runs them itself because Windows has no shell loop to write here.
test-sources = ["tests"]
test-requires = ["httpx[http2]", "cryptography", "websockets"]
test-command = "python tests/run.py --wheel"

[tool.cibuildwheel.windows]
# 64-bit only. Windows' default here is "the native architecture and 32-bit
# x86", and a 32-bit wheel is one nobody asked for whose test dependencies have
# no wheels of their own.
archs = ["AMD64"]

[tool.cibuildwheel.linux]
before-all = "curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }
