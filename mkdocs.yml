site_name: Oxbrook
site_description: A fast Python REST framework with a Rust core, built-in streams, and agent-native interfaces.
site_author: Ishanga Vidusha
site_url: https://ishangavidusha.github.io/oxbrook/
repo_url: https://github.com/ishangavidusha/oxbrook
repo_name: ishangavidusha/oxbrook
docs_dir: www
site_dir: site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            docstring_style: google
            docstring_section_style: table
            filters: ["!^_"]
            heading_level: 2
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_if_no_docstring: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            show_source: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true

nav:
  - Home: index.md
  - Install: install.md
  - Guide:
      - guide/routing.md
      - guide/routers.md
      - guide/parameters.md
      - guide/bodies.md
      - guide/forms.md
      - guide/static.md
      - guide/responses.md
      - guide/requests.md
      - guide/middleware.md
      - guide/dependencies.md
      - guide/lifespan.md
      - guide/sessions.md
      - guide/logging.md
      - guide/errors.md
      - guide/cors.md
      - guide/testing.md
  - Streams:
      - streams/topics.md
      - streams/sse.md
      - streams/websockets.md
      - streams/durable.md
  - Interfaces:
      - openapi.md
      - agents.md
  - Running: running.md
  - Design:
      - design/why.md
      - design/internals.md
      - design/performance.md
  - Reference:
      - reference/app.md
      - reference/http.md
      - reference/streams.md
      - reference/durable.md
      - reference/agents.md
      - reference/toolkit.md
