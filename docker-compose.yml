# Development services for Oxbrook.
#
# Everything Oxbrook talks to runs in a container, so nothing has to be
# installed on the host. Start with `make up`.
#
#   redis     backing store for durable topics (milestone 4)
#   postgres  the database the database suite and example run against
#   keycloak  a real OpenID Connect provider, for tests/oidc.py
#   mongo     a one-member replica set, for tests/mongo.py and examples/mongo
#
# Ports are deliberately non-default (6399, 5499, 8199 and 27099, not 6379,
# 5432, 8080 and 27017) so this never collides with anything already running on
# the machine.

name: oxbrook-dev

services:
  redis:
    image: redis:8-alpine
    container_name: oxbrook-redis
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 256mb
      --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:6399:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    tmpfs:
      # Durable topics are durable in Redis, not on the host. Tests should
      # start from an empty store every time.
      - /data

  postgres:
    image: postgres:18-alpine
    container_name: oxbrook-postgres
    environment:
      POSTGRES_USER: oxbrook
      POSTGRES_PASSWORD: oxbrook
      POSTGRES_DB: oxbrook
    # Durability off: this is a disposable test database, and fsync on every
    # commit inside Docker's VM makes the suite measure the disk, not the
    # framework. max_connections is left at the default 100 on purpose: it is
    # the limit a pool sized per loop runs into, so the suite should meet it.
    command: >
      postgres
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off
    ports:
      - "127.0.0.1:5499:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "oxbrook", "-d", "oxbrook"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s
    tmpfs:
      # Same reasoning as redis: every run starts from an empty database.
      - /var/lib/postgresql

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    container_name: oxbrook-keycloak
    # Development mode on an in-memory database, with the test realm imported
    # at every start: the OIDC suite rotates keys, and each run should begin
    # from the realm as the file describes it.
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Tokens name their issuer from this, and the suite reaches Keycloak
      # through the published port, so the two must agree.
      KC_HOSTNAME: http://localhost:8199
      KC_HEALTH_ENABLED: "true"
      KC_DB: dev-mem
    ports:
      - "127.0.0.1:8199:8080"
    volumes:
      - ./tests/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image has no curl; bash can speak enough HTTP to ask.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

  mongo:
    image: mongo:8
    container_name: oxbrook-mongo
    # A replica set of one: multi-document transactions need a replica set,
    # and the transaction-per-request pattern is part of what is tested.
    # Clients connect with directConnection=true, since the member's name
    # (localhost:27017) is only right inside the container.
    command: ["--replSet", "rs0", "--bind_ip_all", "--quiet"]
    ports:
      - "127.0.0.1:27099:27017"
    healthcheck:
      # Initiates the set on the first check, then reports whether this node
      # has become primary; writes fail until it has.
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok }; db.hello().isWritablePrimary || quit(1)"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    tmpfs:
      # Same reasoning as redis: every run starts from an empty database.
      - /data/db
