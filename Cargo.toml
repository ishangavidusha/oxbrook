[package]
name = "oxbrook-core"
version = "0.1.0"
edition = "2021"
description = "Rust core of the Oxbrook Python web framework"
license = "MIT"
repository = "https://github.com/ishangavidusha/oxbrook"
# The crate is only ever built as the Python extension, through maturin.
publish = false
# What the source distribution carries: the crate, the tests, the licence and
# the README. maturin adds pyproject.toml and python/ itself. Without this the
# sdist held the whole repository, documentation site and benchmarks included.
include = ["/src", "/tests/*.py", "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/README.md"]

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
pythonize = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "signal", "time", "fs", "io-util"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
form_urlencoded = "1.2"
multer = "3"
mime_guess = "2"
httpdate = "1"
percent-encoding = "2.3"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
matchit = "0.9"
http-body-util = "0.1"
bytes = "1"
crossbeam-queue = "0.3"
serde_json = "1"
time = { version = "0.3", default-features = false, features = ["parsing", "formatting", "alloc", "macros"] }
uuid = { version = "1", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
