# Build the documentation site and publish it to GitHub Pages.
#
# Published from release tags, not from every push to main: the site is what
# `pip install oxbrook` gets, and main runs ahead of PyPI. A tag `v<version>`
# publishes that release's docs. "Run workflow" rebuilds from the ref chosen in
# the form, so pick the latest tag there, not main, unless unreleased docs are
# meant to go live.
#
# The API reference is generated by mkdocstrings, which *imports* the package,
# so the Rust extension has to be built before mkdocs runs. A job that installed
# only the Python dependencies would publish a reference with no API in it and
# would not fail while doing so, which is why the last build step asserts a
# known symbol is present.
name: docs

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never two deployments at once, and never cancel one half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # Nothing here is a lockfile, so key the cache on what actually
          # determines the dependency set. Without this uv caches under a key
          # that never changes.
          cache-dependency-glob: pyproject.toml

      - name: Create the environment
        run: |
          uv venv --python 3.14 .venv
          uv pip install --python .venv/bin/python maturin mkdocs-material 'mkdocstrings[python]' ruff

      - name: Build the extension
        run: VIRTUAL_ENV="$PWD/.venv" .venv/bin/maturin develop --release

      - name: Build the site
        run: .venv/bin/python -m mkdocs build --strict

      - name: Assert the API reference is not empty
        run: |
          grep -q 'id="oxbrook.App.route"' site/reference/app/index.html || {
            echo "::error::The reference rendered without any API. The extension did not import."
            exit 1
          }

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
