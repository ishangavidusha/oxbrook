# The test suites, on both interpreter builds, against a real Redis.
#
# Public repositories get standard runners for free, so this runs on every push
# rather than being rationed.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      # Warnings are errors here. The three the crate does carry are silenced
      # one by one in the source, each with a reason, so a new one cannot hide
      # among them.
      - run: cargo clippy --all-targets -- -D warnings

      - uses: astral-sh/setup-uv@v7
      - name: Python lint
        run: uvx ruff check python/oxbrook tests bench examples

  verify:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The free-threaded leg runs under coverage, so the suites are not
          # executed twice just to measure them.
          - label: free-threaded 3.14t
            python: 3.14t
            venv: .venv
            target: coverage
          - label: GIL 3.14
            python: "3.14"
            venv: .venv-gil
            target: verify-gil

    services:
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    timeout-minutes: 20

    env:
      OXBROOK_TEST_REDIS: redis://127.0.0.1:6379
      # Without this, prints are block-buffered and a hung suite leaves a log
      # that stops mid-way through the *previous* suite.
      PYTHONUNBUFFERED: "1"
      # No single suite takes more than a few seconds locally. Two minutes is a
      # hang, and ABRT with faulthandler on dumps every thread's stack instead
      # of just killing it, which is the difference between knowing where it
      # stopped and guessing.
      SUITE_TIMEOUT: timeout --signal=ABRT 120
      PYTHONFAULTHANDLER: "1"
      # Turns tests/durable.py's SKIP into a failure. A green run that never
      # touched milestone 4 is the thing this workflow exists to prevent.
      OXBROOK_REQUIRE_REDIS: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # Keyed by interpreter. The two legs of this matrix run on the same
      # runner image, and a shared cache hands one leg the other's build: on
      # Windows that is a module linked against the interpreter the other leg
      # used, which then cannot be imported at all.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Create the environment
        run: |
          uv venv --python ${{ matrix.python }} ${{ matrix.venv }}
          uv pip install --python ${{ matrix.venv }}/bin/python \
            maturin "httpx[http2]" cryptography openapi-spec-validator websockets redis mcp coverage pydantic

      - name: Confirm the interpreter is the one asked for
        run: |
          ${{ matrix.venv }}/bin/python -c "import sys; \
            print(sys.version); \
            print('gil:', getattr(sys, '_is_gil_enabled', lambda: True)())"

      - name: Run the suites
        run: make ${{ matrix.target }}

      # Not a benchmark — a shared CI machine cannot be measured, and the real
      # harness refuses to try. This only says whether dispatch still serves
      # under concurrency, and gives the Windows leg's number something from
      # the same runner class to sit beside.
      - name: Throughput sanity check
        run: ${{ matrix.venv }}/bin/python bench/smoke.py --seconds 3

      - name: Upload the coverage report
        if: matrix.target == 'coverage'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: htmlcov
          retention-days: 14

  # Windows is a development platform for this project, not a deployment one,
  # so it gets the suites without Redis: `make` is not there to drive them and
  # a service container needs a Linux runner. `tests/run.py` is the same list
  # the Makefile uses, so the two legs cannot run different suites.
  windows:
    name: windows ${{ matrix.label }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: free-threaded 3.14t, python: 3.14t }
          - { label: GIL 3.14, python: "3.14" }
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONFAULTHANDLER: "1"
      VIRTUAL_ENV: .venv
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # See the Linux leg: one cache per interpreter. Sharing it gave this job
      # a `_core.pyd` linked against `python314t.dll`, built by the other leg,
      # and every suite failed at `import oxbrook` with a missing DLL.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Create the environment
        run: |
          uv venv --python ${{ matrix.python }} .venv
          uv pip install --python .venv/Scripts/python.exe `
            maturin "httpx[http2]" cryptography openapi-spec-validator websockets redis mcp pydantic

      - name: Confirm the interpreter is the one asked for
        run: |
          .venv/Scripts/python.exe -c "import sys; print(sys.version); print('gil:', getattr(sys, '_is_gil_enabled', lambda: True)())"

      - name: Build the extension
        run: .venv/Scripts/maturin.exe develop --release

      # No single suite takes more than a few seconds; three minutes is a hang,
      # and one hung suite must not burn the whole job.
      - name: Run the suites
        run: .venv/Scripts/python.exe tests/run.py --timeout 180

      # See the Linux leg: a sanity check, not a measurement. Windows is a
      # development platform here, and no documented number comes from it.
      - name: Throughput sanity check
        run: .venv/Scripts/python.exe bench/smoke.py --seconds 3
